name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options: [staging, prod]
        default: staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: '20'

jobs:
  # =====================================================
  # LINT & TYPECHECK
  # =====================================================
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Typecheck (server)
        run: npx tsc --noEmit -p tsconfig.json

      - name: Typecheck (client)
        run: npx tsc --noEmit -p client/tsconfig.json

  # =====================================================
  # UNIT TESTS
  # =====================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present
        env:
          NODE_ENV: test
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # =====================================================
  # DATABASE MIGRATIONS TEST
  # =====================================================
  migration-test:
    name: Migration Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run migrations against test DB
        run: |
          npm run migration:run --if-present
        env:
          DB_TYPE: sqlite
          DB_PATH: ./data/test.db
          NODE_ENV: test

  # =====================================================
  # BUILD & SCAN CONTAINER
  # =====================================================
  build-and-scan:
    name: Build & Scan Container
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, migration-test]
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # =====================================================
  # DEPLOY TO STAGING
  # =====================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-scan]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep (staging)
        uses: azure/CLI@v1
        with:
          azcliversion: latest
          inlineScript: |
            az deployment sub create \
              --location eastus \
              --template-file infra/bicep/main.bicep \
              --parameters environment=staging \
                containerImage=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
                location=eastus

      - name: Run migrations on staging
        run: |
          # Connect to staging DB and run migrations
          npm run migration:run
        env:
          DB_TYPE: postgres
          DB_HOST: ${{ secrets.STAGING_DB_HOST }}
          DB_PORT: 5432
          DB_NAME: ${{ secrets.STAGING_DB_NAME }}
          DB_USER: ${{ secrets.STAGING_DB_USER }}
          DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          NODE_ENV: staging

      - name: Smoke test staging
        run: |
          sleep 30
          curl -f https://staging.beyond.jadai.dev/api/health || exit 1

  # =====================================================
  # DEPLOY TO PRODUCTION
  # =====================================================
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep (prod)
        uses: azure/CLI@v1
        with:
          azcliversion: latest
          inlineScript: |
            az deployment sub create \
              --location eastus \
              --template-file infra/bicep/main.bicep \
              --parameters environment=prod \
                containerImage=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                location=eastus

      - name: Run migrations on prod
        run: |
          npm run migration:run
        env:
          DB_TYPE: postgres
          DB_HOST: ${{ secrets.PROD_DB_HOST }}
          DB_PORT: 5432
          DB_NAME: ${{ secrets.PROD_DB_NAME }}
          DB_USER: ${{ secrets.PROD_DB_USER }}
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          NODE_ENV: production

      - name: Smoke test prod
        run: |
          sleep 30
          curl -f https://beyond.jadai.dev/api/health || exit 1

      - name: Notify deployment
        if: always()
        run: |
          echo "Deployment to ${{ job.status == 'success' && 'succeeded' || 'failed' }}"